name: VideoBrief
options:
  bundleIdPrefix: com.senbing
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: KKT6ZQ3UV9
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 4
    MARKETING_VERSION: 0.1.0
targets:
  VideoBrief:
    type: application
    platform: iOS
    sources:
      - VideoBrief
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.senbing.VideoBrief
        PRODUCT_NAME: VideoBrief
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: VideoBrief/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          CODE_SIGN_IDENTITY: 1F851D4F16491283FE73D86CC2D11E3EF8B081DF
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: VideoBrief App Store 1
    scheme:
      testTargets:
        - VideoBriefUITests
  VideoBriefUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - VideoBriefUITests
    dependencies:
      - target: VideoBrief
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.senbing.VideoBriefUITests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
